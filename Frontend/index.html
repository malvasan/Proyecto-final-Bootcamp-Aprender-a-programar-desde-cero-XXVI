<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/variables.css">
</head>
<body>
    <header class="container">
        <h1>App de Movies</h1>
    </header>
    <section class="movie-search">
        <form id="searchMovieForm" class="movie-form">
            <div class="g-3 row">
                <div class="col-auto">
                    <label for="movieTitle" class="col-form-label">Title: </label>
                </div>
                <div class="col-auto">
                    <input type="text" id="movieTitle" class="form-control" required>
                </div>
                <div class="col-auto">
                    <label for="movieYear" class="col-form-label">Year: </label>
                </div>
                <div class="col-auto">
                    <input type="number" id="movieYear" class="form-control">
                </div>
                <div class="col-auto">
                    <button type="button" id="btnSearchMovies" class="btn btn-primary">Search</Search></button>
                </div>
            </div>
        </form>
        <table class="table table-dark" id="movieTable">
            <thead>
                <tr>
                    <th style="width:25%">Title</th>
                    <th>Year</th>
                    <th style="width:15%">imdbID</th>
                    <th>Type</th>
                    <th>Poster</th>
                </tr>
            </thead>
            <tbody id="movieTableBody">
                <!--Los datos se insertaran aquí con javasript-->
            </tbody>
        </table>
    </section>
    <footer class="container">
        @manuel-keepcoding
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
